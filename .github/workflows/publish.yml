name: Publish

# A GitHub release stages that version on npm (trusted publishing by OIDC:
# no token is kept in the repository). It goes live, and Matterbridge's
# "Install plugin" finds it, once a maintainer approves it with 2FA on
# npmjs.com (Staged Packages) or with `npm stage approve <id>`.

# Or run by hand (Actions → Publish → Run workflow, on main): it stages the
# version in package.json, then makes its release and tag (v<version>).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # to make the GitHub release when run by hand
  id-token: write # for npm's trusted publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: The release tag is the package's version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: The version is not on npm yet
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "matterbridge-dynalite@$version" version >/dev/null 2>&1; then
            echo "::error::matterbridge-dynalite $version is already on npm: raise the version in package.json first"
            exit 1
          fi

      # Matterbridge is linked, never a dependency: as on a Matterbridge host.
      - name: Install
        run: |
          npm install -g matterbridge
          npm install
          npm link matterbridge

      - name: Typecheck, build and test
        run: |
          npm run typecheck
          npm run clean
          npm run build
          npm test

      # A pre-release goes out under "next", so Matterbridge keeps installing
      # the last full release.
      - name: Stage on npm
        run: npm stage publish ${{ github.event.release.prerelease && '--tag next' || '' }}

      # Run by hand: the release this would otherwise have started from. Made
      # with the workflow's own token, it starts no second run.
      - name: Make the GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          notes="$(awk -v v="## $version " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md)"
          gh release create "v$version" --target "$GITHUB_SHA" --title "$version" --notes "${notes:-See CHANGELOG.md.}"
